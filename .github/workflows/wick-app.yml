# Builds the Wick app for Windows and publishes it as a GitHub release.
# Runs when the app changes on main. Bump "version" in app/package.json to publish a new release
# (tag v<version>); installed apps update themselves from it. Same version again = no new release.
name: Wick app
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/wick-app.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle the Wick script
        run: Copy-Item ../tvwp.user.js wick.user.js
      - name: Install
        run: npm ci
      - name: Build
        run: npx electron-builder --win --x64 --publish never
      - name: Version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT
      - name: Files
        run: Get-ChildItem dist -File | Format-Table Name, Length
      - name: Publish release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Wick ${{ steps.v.outputs.version }}
          body: |
            Download **Wick-Setup-${{ steps.v.outputs.version }}.exe** below and run it. Windows may say "unknown publisher": click More info → Run anyway.
            Already installed? Wick updates itself.
          files: |
            app/dist/Wick-Setup-*.exe
            app/dist/Wick-Setup-*.exe.blockmap
            app/dist/latest.yml
          fail_on_unmatched_files: true
          make_latest: true
